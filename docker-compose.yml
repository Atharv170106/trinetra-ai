# Trinetra AI - offline deployment.
#
#   docker compose up -d --build      first run (needs network for the build)
#   docker compose logs -f trinetra   watch the boot
#   open http://localhost:8080
#
# Air-gap posture: no image pulls at runtime, no CDNs, no external APIs. The app
# reaches Qdrant over the internal compose network (http://qdrant:6333). Qdrant's
# ports are also published, but bound to 127.0.0.1 only - see the ports block.

services:
  qdrant:
    # Pinned to match qdrant-client==1.16.0 in requirements.txt. Keep in lockstep:
    # a 1.19 client against a 1.16 server raises a compatibility warning.
    image: qdrant/qdrant:v1.16.0
    container_name: trinetra_qdrant
    restart: unless-stopped
    volumes:
      # Named volume, not a host bind mount. A bind mount let an accidental
      # `qdrant:latest` pull write a newer on-disk format into ./qdrant_storage;
      # v1.16.0 then panicked on boot deserialising it, and kept panicking
      # because Qdrant scans EVERY subdirectory of collections/ at startup.
      # A named volume starts empty, so that class of corruption cannot recur.
      # Trade-off: the index does not survive `docker compose down -v`, so a
      # fresh stack needs both demo scenes re-ingested before search returns.
      - qdrant_data:/qdrant/storage
    ports:
      # Bound to loopback, not 0.0.0.0. The host needs 6333 to keep running
      # uvicorn from the venv during development, but nothing off-box should be
      # able to reach the vector store.
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      # The image is distroless-ish: no curl, no wget, no shell utilities worth
      # relying on. Qdrant's own binary can answer for it, and `qdrant --version`
      # only proves the binary runs - so probe the socket via bash's /dev/tcp,
      # which needs no external command.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  trinetra:
    build:
      context: .
      dockerfile: Dockerfile
    image: trinetra-ai:latest
    container_name: trinetra-app
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8080:8000"
    environment:
      TRINETRA_QDRANT_URL: http://qdrant:6333
      TRINETRA_LOG_LEVEL: INFO
      # Same-origin now that FastAPI serves the built bundle, so the browser
      # never issues a cross-origin request. Empty = no CORS exemptions at all.
      TRINETRA_CORS_ORIGINS: "[]"
    volumes:
      # Weights and imagery stay on the host: large, slow to copy, and updated
      # independently of the code. Read-only - the app has no reason to write here.
      - ./backend/model_weights:/app/backend/model_weights:ro
      - ./backend/sample_data:/app/backend/sample_data:ro
      # The drop zone. ingest_pipeline.py writes downloaded scenes here; the
      # watchdog picks them up. Previously :ro when only external sneakernet was
      # used; now :rw so the UI-triggered pipeline can write directly.
      #
      # NOTE: inotify does not fire for a bind mount written from the Windows
      # host side, so the watchdog will need PollingObserver, not the default
      # native Observer.
      - ./backend/secure_drop_zone:/app/backend/secure_drop_zone
      # Chip PNGs. Bound to the same directory the venv runs use, so the cache
      # built outside Docker is still valid inside it - tile_ids are identical.
      - ./backend/tiles_cache:/data/tiles_cache
      # Audit log gets its own directory: bind-mounting a single file requires
      # that file to pre-exist, which breaks a clean checkout.
      - ./backend/audit:/data/audit
    # GPU passthrough. Requires the NVIDIA Container Toolkit; on Windows that
    # means Docker Desktop with the WSL2 backend and a current driver.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # A 300M-param ViT plus GDAL blocks on a 16 GB host: cap the container so a
    # runaway ingest cannot swap the whole machine.
    mem_limit: 10g
    shm_size: 1g

volumes:
  qdrant_data:
